<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Ubicación GPS - Jotform</title>
    <!-- Librería oficial de Jotform para comunicación entre Iframe y Formulario -->
    <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 12px;
            background-color: #ffffff;
            color: #333;
        }
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .btn-update {
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .btn-update:hover {
            background-color: #0b5ed7;
        }
        .btn-update:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .status-badge {
            font-size: 13px;
            padding: 6px 10px;
            border-radius: 6px;
            background: #f1f3f5;
            color: #495057;
            flex-grow: 1;
        }
        #map {
            width: 100%;
            height: 280px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
        .coords-footer {
            margin-top: 8px;
            font-size: 12px;
            color: #6c757d;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="header-controls">
        <button type="button" id="btnRefresh" class="btn-update" onclick="obtenerUbicacion()">
            📍 Actualizar Ubicación
        </button>
        <div id="statusText" class="status-badge">Iniciando mapa...</div>
    </div>

    <div id="map"></div>

    <div class="coords-footer">
        <span id="latLonDisplay">Lat: -- | Lon: --</span>
        <span>Puedes arrastrar el pin para ajustar</span>
    </div>

    <script>
        let map;
        let marker;
        let geocoder;
        let currentData = {
            lat: null,
            lng: null,
            address: '',
            accuracy: null
        };

        // 1. Inicializar Google Maps (Coordenadas por defecto: Santiago, Chile)
        function initMap() {
            const defaultPos = { lat: -33.4489, lng: -70.6693 };
            
            map = new google.maps.Map(document.getElementById("map"), {
                center: defaultPos,
                zoom: 15,
                mapTypeControl: false,
                streetViewControl: false
            });

            geocoder = new google.maps.Geocoder();

            marker = new google.maps.Marker({
                position: defaultPos,
                map: map,
                draggable: true, // Permite ajuste fino manual
                title: "Ubicación del registro"
            });

            // Evento cuando el usuario arrastra el pin manualmente
            marker.addListener("dragend", function() {
                const pos = marker.getPosition();
                actualizarDatos(pos.lat(), pos.lng(), "Ajuste manual");
            });

            // Intentar capturar ubicación automáticamente al abrir el formulario
            obtenerUbicacion();
        }

        // 2. Obtener ubicación mediante GPS del dispositivo
        function obtenerUbicacion() {
            const btn = document.getElementById("btnRefresh");
            const status = document.getElementById("statusText");

            if (!navigator.geolocation) {
                status.textContent = "❌ Navegador sin soporte GPS";
                return;
            }

            btn.disabled = true;
            status.textContent = "⏳ Buscando señal GPS precisa...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const acc = Math.round(position.coords.accuracy);

                    const newPos = { lat: lat, lng: lng };
                    map.setCenter(newPos);
                    map.setZoom(17);
                    marker.setPosition(newPos);

                    actualizarDatos(lat, lng, `Precisión: ±${acc}m`);
                    btn.disabled = false;
                },
                (error) => {
                    let msg = "Error de ubicación";
                    if (error.code === 1) msg = "Permiso de GPS denegado";
                    if (error.code === 2) msg = "Señal GPS no disponible";
                    if (error.code === 3) msg = "Tiempo de espera agotado";
                    
                    status.textContent = `⚠️ ${msg}`;
                    btn.disabled = false;
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // 3. Procesar coordenadas, obtener dirección y enviar a Jotform
        function actualizarDatos(lat, lng, infoExtra) {
            const status = document.getElementById("statusText");
            const display = document.getElementById("latLonDisplay");

            display.textContent = `Lat: ${lat.toFixed(6)} | Lon: ${lng.toFixed(6)}`;
            status.textContent = `✅ Ubicación capturada (${infoExtra})`;

            // Geocodificación inversa (Convertir coordenadas a dirección legible)
            geocoder.geocode({ location: { lat, lng } }, (results, statusGeo) => {
                let direccion = "Dirección no resuelta";
                if (statusGeo === "OK" && results[0]) {
                    direccion = results[0].formatted_address;
                }

                // Formato limpio que se guardará en la tabla/PDF de Jotform
                const valorFinalJotform = `${direccion} (${lat.toFixed(6)}, ${lng.toFixed(6)}) | Link: https://maps.google.com/?q=${lat},${lng}`;

                // Enviar datos al formulario padre en Jotform si está embebido allí
                if (window.JFCustomWidget) {
                    JFCustomWidget.sendData({
                        value: valorFinalJotform
                    });
                }
            });
        }

        // Suscripción al evento de envío de Jotform
        if (window.JFCustomWidget) {
            JFCustomWidget.subscribe("ready", function() {
                // El widget está listo dentro de Jotform
            });
            
            JFCustomWidget.subscribe("submit", function() {
                const display = document.getElementById("latLonDisplay").textContent;
                const isValid = !display.includes("--");
                
                JFCustomWidget.sendSubmit({
                    valid: isValid,
                    value: currentData.valorFinalJotform || display
                });
            });
        }
    </script>

    <!-- REEMPLAZA 'TU_API_KEY_AQUI' CON TU CLAVE DE GOOGLE MAPS -->
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCegdytcpj5FZl2Tdg6J8Ixotl6rZm4KSk&callback=initMap">
    </script>

</body>
</html>
